name = "PrimesInProgressionsGRH"
defaultTargets = ["PrimesInProgressions"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "OAI"
roots = ["OAI.NumberTheory.DirichletL.LogarithmicControl"]
globs = ["OAI.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
roots = []
globs = ["PrimeNumberTheoremAnd.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "Vinogradov"
roots = ["Vinogradov"]
globs = ["Vinogradov", "Vinogradov.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "LiouvilleEnergyRH"
roots = ["LiouvilleEnergyRH"]
globs = ["LiouvilleEnergyRH", "LiouvilleEnergyRH.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "ChowlaRH"
roots = ["ChowlaRH"]
globs = ["ChowlaRH", "ChowlaRH.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "AveragedChowla"
roots = ["AveragedChowla"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "PrimesInProgressions"
roots = ["PrimesInProgressions"]
leanOptions = { autoImplicit = false }
